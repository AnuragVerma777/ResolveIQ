services:
  - type: web
    name: resolveiq-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: resolveiq-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DB_PATH
        value: /opt/render/project/src/storage/resolveiq.db
      - key: UPLOAD_DIR
        value: /opt/render/project/src/storage/uploads
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: MAX_REQUEST_BODY_SIZE_MB
        value: "20"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
