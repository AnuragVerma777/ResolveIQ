    <rect x="15" y="15" width="270" height="26" rx="6" fill="#3f3f46"/>
    <text x="150" y="32" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="0.5">🛠️ DEVELOPER SIDE ONLY (OFFLINE)</text>
    
    <text x="150" y="65" font-size="14" font-weight="700" fill="#fafafa" text-anchor="middle">PayPal AI Toolkit</text>
    <text x="150" y="83" font-size="11" font-weight="500" fill="#a1a1aa" text-anchor="middle">github.com/paypal/AI-Toolkit</text>

    <line x1="30" y1="95" x2="270" y2="95" stroke="#3f3f46" stroke-width="1"/>
    
    <text x="25" y="115" font-size="11" fill="#d4d4d8">• MCP Server in Cursor / VS Code</text>
    <text x="25" y="133" font-size="11" fill="#d4d4d8">• OpenAPI Spec Exploration</text>
    <text x="25" y="151" font-size="11" fill="#d4d4d8">• Schema Inspection &amp; Mock Testing</text>
    
    <rect x="25" y="163" width="250" height="18" rx="4" fill="#713f12" opacity="0.6"/>
    <text x="150" y="176" font-size="10" font-weight="600" fill="#fde047" text-anchor="middle">⚠️ Never Injected into Runtime Image</text>
