    <text x="15" y="145" font-size="10.5" fill="#cbd5e1">• Dispute Categorization</text>
    <text x="15" y="165" font-size="10.5" fill="#cbd5e1">• Structured Document Extraction</text>
    <text x="15" y="185" font-size="10.5" fill="#cbd5e1">• Grounded Rebuttal Synthesis</text>
