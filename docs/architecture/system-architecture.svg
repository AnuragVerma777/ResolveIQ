      <text x="214" y="42" font-size="9.5" fill="#94a3b8" text-anchor="middle">Multi-Format Intake,</text>
      <text x="214" y="56" font-size="9.5" fill="#94a3b8" text-anchor="middle">PyMuPDF / OCR</text>
